name: PUSH-CE-BUILD-TO-TESTDEMO

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  AzureBuild:
    name: Azure-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: running update
        run: sudo apt update
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.7.0
        with:
          checkout-fetch-depth: 0
          java-version: 8
          java-distribution: temurin
          maven-version: 3.6.3
      - name: Building commons jar
        run: |
          cd commons
          mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true
      - name: Building Jobs jar
        run: |
          cd jobs/azure-discovery/
          mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true
      - name: Upload Jobs artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-azure-artifact
          path: ./dist/jobs
  Push-azure-TestDemo:
    name: Push azure-discovery to s3 test-demo
    runs-on: ubuntu-latest
    environment: 'SaaSTestDemo'
    needs:
      - AzureBuild
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials for Test-Demo account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Download Jobs artifact
        uses: actions/download-artifact@v4
        with:
          name: jobs-azure-artifact
          path: ./dist/jobs
      - name: copy Jobs jars to S3 
        run: |
          aws s3 cp --recursive ./dist/jobs/ s3://${{ secrets.AWS_BUCKET_DEV }}/vlatest/dev/jobs
